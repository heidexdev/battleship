<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship</title>
  </head>
  <body>
    <header class="game-header">
      <h1>Battleship</h1>
      <p id="game-status">Place your ships to start the game.</p>
    </header>

    <main class="game-layout">
      <section class="board-section">
        <h2>Your Board</h2>
        <div class="player-container">
          <div class="player-board"></div>
          <div class="selection"></div>
        </div>
      </section>

      <section class="board-section">
        <h2>Enemy Board</h2>
        <div class="computer-board"></div>
      </section>
    </main>

    <div class="game-controls">
      <button id="start-game" type="button" disabled>Start Game</button>
      <button id="reset-game" type="button">Reset Game</button>
    </div>
  </body>
</html>
